name: Madeira External IPA v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Build modified IPA
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/m.ipa "https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa"
          echo "71e900cbc140778bd6fa67c1062821981ed98e6bfb674d853cfeefd6d242e1c0  /tmp/m.ipa" | shasum -a 256 -c -
          mkdir -p /tmp/w out
          unzip -q /tmp/m.ipa -d /tmp/w
          curl -L --fail -o /tmp/old.yml "https://raw.githubusercontent.com/Louisdeb1/Madeira-external-storage/main/.github/workflows/build-overlay.yml"
          python3 -c "import html; s=open('/tmp/old.yml').read(); a=s.index('@import UIKit;'); b=s.index('          OBJC',a); q=s[a:b].splitlines(); q=[q[0]]+[x[10:] if x.startswith('          ') else x for x in q[1:]]; open('/tmp/o.m','w').write(html.unescape(chr(10).join(q))+chr(10))"
          APP=/tmp/w/Payload/Madeira.app
          nm -gU "$APP/Madeira.debug.dylib" > /tmp/syms
          for s in _wine_process_start _wine_process_is_running _wineserver_start _wineserver_is_running; do grep -q " $s$" /tmp/syms || exit 1; done
          codesign -d --entitlements :- "$APP" > /tmp/app-ent.plist 2>/dev/null || true
          codesign -d --entitlements :- "$APP/PlugIns/MadeiraJITHelper.appex" > /tmp/ext-ent.plist 2>/dev/null || true
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mv "$APP/Madeira.debug.dylib" "$APP/Morig.dylib"
          install_name_tool -id '@loader_path/Morig.dylib' "$APP/Morig.dylib"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$SDK" -dynamiclib -fobjc-arc -fblocks -framework UIKit -framework Foundation -framework UniformTypeIdentifiers -framework QuartzCore -Wl,-reexport_library,"$APP/Morig.dylib" -Wl,-install_name,@rpath/Madeira.debug.dylib /tmp/o.m -o "$APP/Madeira.debug.dylib"
          otool -L "$APP/Madeira.debug.dylib"
          rm -rf "$APP/_CodeSignature" "$APP/PlugIns/MadeiraJITHelper.appex/_CodeSignature"
          codesign -f -s - "$APP/Morig.dylib"
          codesign -f -s - "$APP/Madeira.debug.dylib"
          codesign -f -s - "$APP/Frameworks/StikJIT.framework"
          codesign -f -s - --entitlements /tmp/ext-ent.plist "$APP/PlugIns/MadeiraJITHelper.appex"
          codesign -f -s - --entitlements /tmp/app-ent.plist "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p out/Payload
          ditto "$APP" out/Payload/Madeira.app
          (cd out; zip -qry Madeira-external-storage.ipa Payload)
          shasum -a 256 out/Madeira-external-storage.ipa | tee out/Madeira-external-storage.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-external-storage-IPA
          path: out/
